<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-c">
  <title id="title-c">Suarlog Concept C - Minimal Monogram S Log Pulse</title>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#0f172a"/>
  
  <!-- Geometric S created from digital audio stream blocks -->
  <!-- Top bar of S -->
  <rect x="52" y="48" width="132" height="28" rx="14" fill="#38bdf8"/>
  <!-- Top-left vertical spine -->
  <rect x="52" y="48" width="32" height="74" rx="16" fill="#0284c7"/>
  <!-- Middle crossbar connecting S -->
  <rect x="52" y="114" width="152" height="28" rx="14" fill="#38bdf8"/>
  <!-- Bottom-right vertical spine -->
  <rect x="172" y="114" width="32" height="78" rx="16" fill="#0284c7"/>
  <!-- Bottom bar of S -->
  <rect x="72" y="180" width="132" height="28" rx="14" fill="#38bdf8"/>
  
  <!-- Optical pulse accent indicator -->
  <circle cx="184" cy="62" r="10" fill="#ffffff"/>
  <circle cx="72" cy="194" r="10" fill="#ffffff"/>
</svg>
